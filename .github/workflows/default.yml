name: default

on:
  pull_request:
    branches:
      - beta
  push:
    branches:
      - beta
  release:
    types: [published]
  workflow_dispatch:

env:
  ASPIRE_CLI_TELEMETRY_OPTOUT: true
  ASPIRE_NON_INTERACTIVE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build:
    permissions:
      checks: write
      contents: read

    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: setup node
        uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: ./**/package-lock.json
          node-version: 24.x

      - name: setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          cache: true
          cache-dependency-path: src/**/packages.lock.json
          global-json-file: global.json

      - name: restore
        run: dotnet tool restore && dotnet workload restore && dotnet restore --locked-mode

      - name: build
        run: dotnet build --no-restore

  publish:
    # if: github.event_name == 'release' && github.event.action == 'published'
    needs: [build]

    permissions:
      attestations: write
      checks: write
      contents: write
      id-token: write
      packages: write

    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: setup docker
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: setup node
        uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: ./**/package-lock.json
          node-version: 24.x

      - name: setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          cache: true
          cache-dependency-path: src/**/packages.lock.json
          global-json-file: global.json

      - name: restore
        run: dotnet tool restore && dotnet workload restore && dotnet restore --locked-mode

      - name: push images
        run: dotnet aspire do push --apphost src/Platform/src/Wadio.Platform.csproj -e Staging --non-interactive

      - name: extract version
        id: version
        shell: pwsh
        run: |
          $version = $(dotnet msbuild .\src\Platform\src\Wadio.Platform.csproj -target:"MinVer;SetVersion" -getProperty:ContainerImageTag)
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: generate compose
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          dotnet aspire publish --apphost src/Platform/src/Wadio.Platform.csproj -o ./dist -e Staging --non-interactive

          IMAGE_URL="ghcr.io/escd/wadio/wadio"
          ENV_FILE="./dist/.env"

          upsert() {
            local key="$1" val="$2"
            if grep -q "^${key}=" "$ENV_FILE" 2>/dev/null; then
              sed -i "s|^${key}=.*|${key}=${val}|" "$ENV_FILE"
            else
              echo "${key}=${val}" >> "$ENV_FILE"
            fi
          }

          upsert "API_IMAGE" "$IMAGE_URL-api:$VERSION"
          upsert "DISCORD_IMAGE" "$IMAGE_URL-discord:$VERSION"
          upsert "ROUTER_IMAGE" "$IMAGE_URL-router:$VERSION"
          upsert "WEB_IMAGE" "$IMAGE_URL-web:$VERSION"

      - name: publish artifact
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: wadio-docker-compose
          path: ./dist
          retention-days: 14
