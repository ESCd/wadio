name: default

on:
  pull_request:
    branches:
      - beta
  push:
    branches:
      - beta
  release:
    types: [published]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build:
    permissions:
      checks: write
      contents: read

    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: setup node
        uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: ./**/package-lock.json
          node-version: 24.x

      - name: setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          cache: true
          cache-dependency-path: src/**/packages.lock.json
          global-json-file: global.json

      - name: restore
        run: dotnet tools restore && dotnet workload restore && dotnet restore --locked-mode

      - name: build
        run: dotnet build --no-restore

  publish:
    # if: github.event_name == 'release' && github.event.action == 'published'
    needs: [build]
    outputs:
      version: ${{ steps.version.outputs.value }}

    permissions:
      checks: write
      contents: write
      packages: write

    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: setup docker
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: setup buildx
        uses: docker/setup-buildx-action@v4

      - name: setup node
        uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: ./**/package-lock.json
          node-version: 24.x

      - name: setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          cache: true
          cache-dependency-path: src/**/packages.lock.json
          global-json-file: global.json

      - name: restore
        run: dotnet tools restore && dotnet workload restore && dotnet restore --locked-mode

      - name: push images
        env:
          # Parameters__PublicUrl:             "https://placeholder.invalid"
          # Parameters__CloudflareTunnelToken: "placeholder"
          ASPIRE_NON_INTERACTIVE: "true"
        run: aspire do push --apphost src/Platform/src/Wadio.Platform.csproj --environment Staging --output ./dist --non-interactive

      - name: publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: wadio-compose
          path: ./dist
          retention-days: 14

      - name: extract version
        id: version
        shell: pwsh
        run: |
          $version = $(dotnet msbuild .\src\Platform\src\Wadio.Platform.csproj -target:"MinVer;SetVersion" -getProperty:ContainerImageTag)
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
